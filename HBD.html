<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First GitHub Webpage</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #2563eb;
        }

        body.dark-theme {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: var(--accent-color);
            margin-top: 0;
        }

        p {
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            background-color: rgba(34, 197, 94, 0.15);
            color: #16a34a;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="status-badge">● Live via GitHub Pages</span>
        <h1>Hello, World!</h1>
        <p>If you can see this page, your HTML deployment to GitHub Pages was successful!</p>
        
        <button id="themeToggleBtn">Switch Theme</button>
    </div>

    <script>
        const btn = document.getElementById('themeToggleBtn');
        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });
    </script>
</body>
</html>
